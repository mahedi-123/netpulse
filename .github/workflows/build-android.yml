name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web assets for the APK
        working-directory: mobile
        run: npm run build:app

      - name: Verify web assets landed
        run: |
          test -f android/app/src/main/assets/www/index.html
          test -f android/app/src/main/assets/www/ndt7-download-worker.js

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/netpulse.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-apk
          path: artifacts/netpulse.apk
          if-no-files-found: error
          retention-days: 90
