  <body>
    <div id="root"></div>
    <script>
      // The service worker exists to make the PWA load offline when it's served
      // from the PC. Inside the Android app the assets are already local, so
      // registering it adds nothing and risks serving stale content after an
      // app update - skip it there.
      var isAndroidApp = typeof window.AndroidNet !== "undefined";
      if ("serviceWorker" in navigator && !isAndroidApp) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {
            // SW is a progressive enhancement - the app works fine without it.
          });
        });
      }
    </script>
  </body>
